name: shuye_reader
description: "书叶：安静、私有、本地优先的 Android 阅读器。"
publish_to: 'none'
version: 0.3.5+8

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  archive: ^4.0.7
  crypto: ^3.0.6
  file_picker: ^10.3.10
  gbk_codec: ^0.4.0
  html: ^0.15.6
  path: ^1.9.1
  sqflite: ^2.4.2
  xml: ^6.6.1
  pdfrx: ^2.6.5
  flutter_secure_storage: ^10.3.4
  cryptography: ^2.9.0
  http: ^1.6.0
  path_provider: ^2.1.6
  just_audio: ^0.10.6
  just_audio_background: ^0.0.1-beta.17
  google_mlkit_text_recognition: ^0.17.1
  share_plus: ^12.0.2
  sqflite_sqlcipher: ^3.4.1
  local_auth: ^3.0.2
  hyphenatorx: ^1.5.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.6

flutter:
  uses-material-design: true
  assets:
    - LICENSE
    - assets/art/mountain.webp
    - assets/art/poetry.webp
    - assets/art/notebook.webp
    - assets/art/shuye-cover.webp
    - assets/art/shuye-mark.webp
    - assets/chinese/
  shaders:
    - shaders/page_curl.frag
